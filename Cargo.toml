[workspace]
members = ["cli"]
exclude = ["site/wasm"]

[package]
name = "tot"
version = "0.1.0"
edition = "2024"
# Edition 2024 needs 1.85; the let-chains in `lint`, `parse`, and the CLI need 1.88. Declared so
# that an older toolchain gets cargo's "requires rustc 1.88 or newer" instead of a raw error
# about an edition it has never heard of.
rust-version = "1.88"
description = "JSON with the punctuation removed"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["config", "configuration", "parser", "json", "serde"]
categories = ["config", "parser-implementations", "encoding"]
repository = "https://github.com/totlang/tot"
exclude = ["/.github", "/.gitattributes", "/site"]

# The library stays dependency-free by default; each converter pulls its parser only when its
# feature is on.
[dependencies]
serde = { version = "1.0", optional = true }
# `preserve_order` keeps a converted table in the document's order; without it `toml::Table` is
# a `BTreeMap` and every conversion, in both directions, comes back alphabetized.
#
# It leaks, and there is no way to stop it: cargo resolves a package's features once for the
# whole graph, so turning on tot's `toml` feature turns `preserve_order` on for any *other*
# crate in the same build that uses `toml` directly, moving its table iteration from sorted to
# insertion order. Documented under `yaml and toml` in the README, because a consumer who hits
# it will be looking at their own output and not at this line.
toml = { version = "1.1.4", optional = true, features = ["preserve_order"] }
yaml_serde = { version = "0.10.7", optional = true }

[features]
# Off by default so that the parser, the formatter, and JSON output cost nothing.
serde = ["dep:serde"]
# The YAML converter, and the parser it needs.
yaml = ["dep:yaml_serde"]
# The TOML converter, and the parser it needs.
toml = ["dep:toml"]

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }

[package.metadata.docs.rs]
all-features = true
