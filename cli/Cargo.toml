[package]
name = "tot-cli"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Command-line interface for tot — JSON with the punctuation removed"
license = "MIT OR Apache-2.0"
readme = "../README.md"
keywords = ["config", "configuration", "cli", "json", "formatter"]
categories = ["command-line-utilities", "config", "development-tools"]
repository = "https://github.com/totlang/tot"

[[bin]]
name = "tot"
path = "src/main.rs"

[dependencies]
# The version is what cargo publishes against; the path is what a local build uses. Without a
# version requirement `cargo publish` refuses the crate outright. The `tot to` / `tot from`
# commands are the library's converters — the binary has none of its own.
tot = { path = "..", version = "0.1.0", features = ["yaml", "toml"] }
