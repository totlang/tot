[package]
name = "tot-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "The tot playground's bridge into the tot library"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Standalone on purpose: the root workspace excludes this crate and drives it by
# `--manifest-path`, and an empty table here stops the search for a workspace before it
# climbs out of whatever checkout this directory lives in — a linked worktree's copy sits
# inside another checkout's tree, whose exclude list cannot name it.
[workspace]

[dependencies]
# The library, with the two converters the page offers turned on. They are the same code
# `tot to` runs, so the playground cannot disagree with the tool.
tot = { path = "../..", features = ["yaml", "toml"] }
wasm-bindgen = "0.2"

# wasm-pack calls wasm-opt with a bare `-O`, which leaves every wasm feature at binaryen's
# defaults. Rust's wasm32 baseline has moved on since those defaults were set, so the flags have
# to be named or wasm-opt rejects its own input as invalid ("memory.copy operations require bulk
# memory operations"). `-Os` because this is a page load, not a server binary.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-Os",
    "--enable-bulk-memory",
    "--enable-bulk-memory-opt",
    "--enable-nontrapping-float-to-int",
    "--enable-sign-ext",
    "--enable-multivalue",
    "--enable-reference-types",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
